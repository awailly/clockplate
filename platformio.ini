[platformio]
default_envs = inkplate2

[env:inkplate2]
platform = espressif32 @ 6.11.0
framework = arduino
monitor_speed = 115200
board = esp32dev
; 80MHz is plenty for a clock (panel refresh time is set by the e-paper
; physics, not the CPU) and saves power while awake
board_build.f_cpu = 80000000L
; no OTA needed on this device, use the whole flash for the app
board_build.partitions = huge_app.csv

; The Inkplate library prioritizes ARDUINO_ESP32_DEV (thinking it is an
; Inkplate 6 for BC reasons), so make sure it is not set.
build_unflags =
  -DARDUINO_ESP32_DEV

lib_deps =
  https://github.com/SolderedElectronics/Inkplate-Arduino-library#10.2.1

; NOTE: no default upload target: a bare `pio run` only builds. Flash
; explicitly with `pio run -t upload` (and check the MAC in the log if
; several Inkplates are around).
monitor_filters = time, esp32_exception_decoder, default

build_flags =
  -DARDUINO_INKPLATE2
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
    ; the Inkplate 2 has an ESP32-WROVER with 8MB PSRAM, and the Inkplate
    ; library allocates its framebuffer there (ps_malloc returns NULL and
    ; display.begin() fails without these flags)
  -Wall
  -Wextra
  -Wno-unused-parameter
